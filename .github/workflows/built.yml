name: Build FancyEggs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Wichtig für Release-Erstellung

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # Version aus pom.xml auslesen
      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Optional: Build-Nummer als Suffix für eindeutige Releases
      - name: Create Release Tag
        id: tag
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}-build.${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      # JAR umbenennen, damit sie im Download schöner heißt
      - name: Rename JAR
        run: |
          mkdir -p release
          cp target/FancyEggs-*.jar release/FancyEggs-${{ steps.get_version.outputs.VERSION }}.jar

      # Release mit JAR erstellen
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "FancyEggs ${{ steps.get_version.outputs.VERSION }} (Build ${{ github.run_number }})"
          body: |
            Automatischer Build vom ${{ github.event.head_commit.timestamp }}
            Commit: `${{ github.sha }}`
          files: release/FancyEggs-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
