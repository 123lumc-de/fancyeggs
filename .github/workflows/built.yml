name: Build FancyEggs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Erlaubt manuelles Starten über den "Run workflow"-Button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload Artifact (FancyEggs JAR)
        uses: actions/upload-artifact@v4
        with:
          name: FancyEggs-Jar
          path: target/FancyEggs-*.jar
          if-no-files-found: error
