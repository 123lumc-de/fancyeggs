name: FancyEggs
version: 1.0
main: de.lmcstudio.fancyeggs.FancyEggs
api-version: '1.21'
depend: [Vault]
authors: [LMCStudio]
description: Ein passives Einkommens-Plugin mit Eggs.
commands:
  fancyeggs:
    description: Öffnet das FancyEggs-Menü.
    usage: /fancyeggs
    aliases: [eggs, fe]
    permission: fancyeggs.use
permissions:
  fancyeggs.use:
    default: true
  fancyeggs.admin:
    default: op
