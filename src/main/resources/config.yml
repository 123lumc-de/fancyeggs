# ================================================
#   FancyEggs - Konfiguration
# ================================================

language: de
charged-multiplier: 1.25

# ================================================
#   EGG LISTE - Beliebig erweiterbar
# ================================================
# base-income: Geld pro SEKUNDE auf Level 1
# base-upgrade-cost: Preis für das erste Upgrade
# ================================================

eggs:
  Chicken_Egg:
    display-name: "Chicken Egg"
    icon: CHICKEN_SPAWN_EGG
    base-income: 15.0
    base-upgrade-cost: 5.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Parrot_Egg:
    display-name: "Parrot Egg"
    icon: PARROT_SPAWN_EGG
    base-income: 35.0
    base-upgrade-cost: 10.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Blaze_Egg:
    display-name: "Blaze Egg"
    icon: BLAZE_SPAWN_EGG
    base-income: 45.0
    base-upgrade-cost: 20.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Squid_Egg:
    display-name: "Squid Egg"
    icon: SQUID_SPAWN_EGG
    base-income: 80.0
    base-upgrade-cost: 35.0
    upgrade-multiplier: 1.6
    sell-multiplier: 4.0

  Warden_Egg:
    display-name: "Warden Egg"
    icon: WARDEN_SPAWN_EGG
    base-income: 150.0
    base-upgrade-cost: 50.0
    upgrade-multiplier: 1.8
    sell-multiplier: 4.0

# ================================================
#   WÄHRUNGS-EINSTELLUNGEN
# ================================================
# Standard: FancyEggs liest die Währung automatisch aus Vault.
# Wenn dein Economy-Plugin etwas Falsches ausgibt, kannst du es hier überschreiben.
#
# currency.symbol:  Leer lassen = Vault nutzen
#                   Beispiel: "$", "€", "Coins", "Taler"
#
# currency.format:  Platzhalter:
#                     {symbol} = Währungssymbol
#                     {amount} = Formatierter Betrag (z.B. 1.50K)
#                   Beispiele:
#                     "{symbol}{amount}"    ->  $1.50K
#                     "{amount} {symbol}"   ->  1.50K Coins
#                     "{symbol} {amount}"   ->  $ 1.50K
# ================================================
currency:
  symbol: ""                # Leer = Vault nutzen
  format: "{symbol}{amount}"
