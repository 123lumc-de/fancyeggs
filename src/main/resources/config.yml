# ================================================
#   FancyEggs - Konfiguration
# ================================================

# Sprache des Plugins
# Verfügbar: "de" (Deutsch, Standard) oder "en" (English)
language: de

# ================================================
#   EGG LISTE
# ================================================
# Du kannst hier beliebig viele Eggs hinzufügen.
# Wichtig: Jedes Egg braucht einen eindeutigen Key (z.B. Chicken_Egg).
# Die Reihenfolge in der Datei bestimmt die Reihenfolge im GUI.
#
# Eigenschaften:
#   display-name:   Name, der im GUI angezeigt wird
#   icon:           Minecraft-Material (Bukkit Material-Name)
#   base-income:    Geld pro Sekunde auf Level 1
#   base-upgrade-cost: Preis für das erste Upgrade
#   upgrade-multiplier: Multiplikator pro Level
#   sell-multiplier: Multiplikator für Verkaufspreis (4.0 = 4x Upgrade-Preis)
#
# Icon-Materialien: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
# ================================================

eggs:
  Chicken_Egg:
    display-name: "Chicken Egg"
    icon: CHICKEN_SPAWN_EGG
    base-income: 15.0
    base-upgrade-cost: 25000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Parrot_Egg:
    display-name: "Parrot Egg"
    icon: PARROT_SPAWN_EGG
    base-income: 35.0
    base-upgrade-cost: 50000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Blaze_Egg:
    display-name: "Blaze Egg"
    icon: BLAZE_SPAWN_EGG
    base-income: 45.0
    base-upgrade-cost: 100000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Squid_Egg:
    display-name: "Squid Egg"
    icon: SQUID_SPAWN_EGG
    base-income: 80.0
    base-upgrade-cost: 175000.0
    upgrade-multiplier: 1.6
    sell-multiplier: 4.0

  Warden_Egg:
    display-name: "Warden Egg"
    icon: WARDEN_SPAWN_EGG
    base-income: 150.0
    base-upgrade-cost: 250000.0
    upgrade-multiplier: 1.8
    sell-multiplier: 4.0

