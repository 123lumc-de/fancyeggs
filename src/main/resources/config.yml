# ================================================
#   FancyEggs - Konfiguration
# ================================================

# Sprache - wähle eine Datei aus dem Ordner "languages/"
# Standard verfügbar: de_DE, en_US
# Du kannst eigene Sprachen hinzufügen: z.B. "fr_FR" -> languages/fr_FR.yml
language: de_DE

# Charged-System
charged-chance: 20
charged-multiplier: 1.25

# Standard-Slots (falls keine fancyeggs.slots.X Permission)
default-slots: 1

# ================================================
#   DATENBANK
# ================================================
storage:
  type: h2

  mysql:
    host: "localhost"
    port: 3306
    database: "fancyeggs"
    username: "root"
    password: ""
    table-prefix: "fancyeggs_"

  h2:
    file: "data"

# ================================================
#   EGGS
# ================================================
eggs:
  Chicken_Egg:
    display-name: "Chicken Egg"
    icon: CHICKEN_SPAWN_EGG
    base-income: 15.0
    base-upgrade-cost: 5.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Parrot_Egg:
    display-name: "Parrot Egg"
    icon: PARROT_SPAWN_EGG
    base-income: 35.0
    base-upgrade-cost: 10.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Blaze_Egg:
    display-name: "Blaze Egg"
    icon: BLAZE_SPAWN_EGG
    base-income: 45.0
    base-upgrade-cost: 20.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Squid_Egg:
    display-name: "Squid Egg"
    icon: SQUID_SPAWN_EGG
    base-income: 80.0
    base-upgrade-cost: 35.0
    upgrade-multiplier: 1.6
    sell-multiplier: 4.0

  Warden_Egg:
    display-name: "Warden Egg"
    icon: WARDEN_SPAWN_EGG
    base-income: 150.0
    base-upgrade-cost: 50.0
    upgrade-multiplier: 1.8
    sell-multiplier: 4.0
