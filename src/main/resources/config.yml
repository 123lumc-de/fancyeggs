# ================================================
#   FancyEggs - Konfiguration
# ================================================

# Sprache: "de" (Standard) oder "en"
language: de

# Globaler Multiplikator für Charged Eggs (1.25 = +25%)
charged-multiplier: 1.25

# ================================================
#   EGG LISTE - Beliebig erweiterbar
# ================================================
# Du kannst hier unbegrenzt viele Eggs hinzufügen.
# Jedes Egg braucht einen eindeutigen Key (z.B. Chicken_Egg).
# Die Reihenfolge in der Datei = Reihenfolge im GUI.
#
# Eigenschaften:
#   display-name:       Anzeigename im GUI
#   icon:               Bukkit-Material (z.B. CHICKEN_SPAWN_EGG, DIAMOND, BLAZE_ROD)
#   base-income:        Geld pro Sekunde auf Level 1
#   base-upgrade-cost:  Preis für das erste Upgrade
#   upgrade-multiplier: Multiplikator pro Level
#   sell-multiplier:    Verkaufspreis = X * Upgrade-Preis (4.0 = 4x)
#
# Material-Liste: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
# ================================================

eggs:
  Chicken_Egg:
    display-name: "Chicken Egg"
    icon: CHICKEN_SPAWN_EGG
    base-income: 15.0
    base-upgrade-cost: 5000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Parrot_Egg:
    display-name: "Parrot Egg"
    icon: PARROT_SPAWN_EGG
    base-income: 35.0
    base-upgrade-cost: 10000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Blaze_Egg:
    display-name: "Blaze Egg"
    icon: BLAZE_SPAWN_EGG
    base-income: 45.0
    base-upgrade-cost: 20000.0
    upgrade-multiplier: 1.5
    sell-multiplier: 4.0

  Squid_Egg:
    display-name: "Squid Egg"
    icon: SQUID_SPAWN_EGG
    base-income: 80.0
    base-upgrade-cost: 35000.0
    upgrade-multiplier: 1.6
    sell-multiplier: 4.0

  Warden_Egg:
    display-name: "Warden Egg"
    icon: WARDEN_SPAWN_EGG
    base-income: 150.0
    base-upgrade-cost: 50000.0
    upgrade-multiplier: 1.8
    sell-multiplier: 4.0

